<header class="site-header">
  <div class="institution-bar">
    <div class="header-shell">
      <a href="https://www.ntu.edu.cn/" class="institution-link">Nantong University</a>
      <span>Power Electronics Research</span>
    </div>
  </div>

  <div class="brand-row header-shell">
    <a href="{{ "/" | relative_url }}" class="home" aria-label="{{ site.title }} home">
      <img
        class="lab-wordmark"
        src="{{ "/images/brand/ntupel-horizontal.png" | relative_url }}"
        alt="NTUPEL"
        width="963"
        height="150"
      >
      <span class="title-text">
        <span class="title">{{ site.title }}</span>
        <span class="subtitle">{{ site.subtitle }}</span>
      </span>
    </a>
  </div>

  <div class="nav-row">
    <div class="header-shell nav-shell">
      <input class="nav-toggle" type="checkbox" aria-label="Show or hide navigation">
      <nav aria-label="Primary navigation">
        {% assign pages = site.pages
          | where_exp: "page", "page.nav"
          | sort: "nav.order"
        %}
        <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
        {% for nav_page in pages %}
          {% if nav_page.nav %}
            <a
              href="{{ nav_page.dir | relative_url | uri_escape }}"
              {% if page.url contains nav_page.dir %}aria-current="page"{% endif %}
            >
              {{ nav_page.title }}
            </a>
          {% endif %}
        {% endfor %}
      </nav>
    </div>
  </div>
</header>
